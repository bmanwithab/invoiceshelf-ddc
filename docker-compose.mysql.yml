#-------------------------------------------
# InvoiceShelf MySQL/MariaDB docker-compose variant
# Repo : https://github.com/InvoiceShelf/docker
#-------------------------------------------

services:
  database:
    container_name: invoiceshelf-mariadb
    image: mariadb:10
    environment:
      - MYSQL_DATABASE=invoiceshelf # ⚠️ Change DB name before proceeding
      - MYSQL_USER=invoiceshelf # ⚠️ Change DB username before proceeding
      - MYSQL_PASSWORD=${DB_PASSWORD} # ⚠️ password kept in Coolify env DB_PASSWORD
      - MYSQL_ROOT_PASSWORD=${DB_ROOT_PASSWORD} # kept in Coolify env DB_ROOT_PASSWORD
    volumes:
      - invoiceshelf_mariadb:/var/lib/mysql
    networks:
      - invoiceshelf
    healthcheck:
      test: ["CMD", "mariadb-admin" ,"ping", "-h", "localhost"]
      timeout: 20s
      retries: 10
    restart: unless-stopped

  webapp:
    container_name: invoiceshelf-variant-mariadb
    image: ghcr.io/bmanwithab/invoiceshelf-ddc:3.0.0-alpha.15-ddc0.2.1-b2
    environment:
      # Brand: drives the mail footers and the app's default name.
      - APP_NAME=Air Reel Technologies
      - BRAND_NAME=Air Reel Technologies

      # This install is white-labelled: no "Powered by" line under the sign-in
      # page, the public documents or the document emails.
      - INVOICESHELF_POWERED_BY=false

      # AGPL section 13: the source of the version actually running is this fork.
      - INVOICESHELF_SOURCE_URL=https://github.com/bmanwithab/InvoiceShelf_v3/tree/{version}
      - APP_ENV=production
      - APP_DEBUG=false

      # APP_URL should have:
      # 1. Protocol http or https if you are accessing it via reverse proxy with
      #    SSL, then it will be https, if via local IP, then http.
      # 2. IP address of the server or the domain name
      # 3. (optional) If you are using a custom port such as :8080 or another.
      # REF: https://github.com/InvoiceShelf/InvoiceShelf/issues/213#issuecomment-3026790543
      - APP_URL=${APP_URL}

      # SESSION_DOMAIN should have:
      # 1. IP address of the server or the domain name
      # 2. (optional) If you are using a custom port such as :8080 or another.
      # REF: https://github.com/InvoiceShelf/InvoiceShelf/issues/213#issuecomment-3026790543
      - SESSION_DOMAIN=${SESSION_DOMAIN}

      # SANCTUM_STATEFUL_DOMAINS should have:
      # 1. IP address of the server or the domain name
      #    1.1 (optional) If you are setting a custom port such as :8080 or another.
      # 2. (optional) If you are planning to access the application from different
      #    domains, you must add a comma between each domain
      # REF: https://github.com/InvoiceShelf/InvoiceShelf/issues/213#issuecomment-3026790543
      - SANCTUM_STATEFUL_DOMAINS=${SANCTUM_STATEFUL_DOMAINS}

      # The container runs Laravel's scheduler itself, which is what creates
      # recurring invoices, flags invoices overdue and expires estimates. Set
      # this to false only if you drive the schedule from elsewhere, such as a
      # second container running `php artisan schedule:work`, or if you run
      # more than one replica and want exactly one of them schedulding.
      # - SCHEDULER_ENABLED=true

      - DB_CONNECTION=mariadb
      - DB_HOST=database
      - DB_PORT=3306
      - DB_DATABASE=invoiceshelf # ⚠️ Change DB name before proceeding
      - DB_USERNAME=invoiceshelf # ⚠️ Change DB username before proceeding
      - DB_PASSWORD=${DB_PASSWORD} # ⚠️ password kept in Coolify env DB_PASSWORD
      - DB_PASSWORD_FILE=
      - CACHE_STORE=file
      - SESSION_DRIVER=file
      - SESSION_LIFETIME=240
      - AUTORUN_ENABLED=true
      - AUTORUN_LARAVEL_MIGRATION=false
      - AUTORUN_LARAVEL_OPTIMIZE=false
      - PHP_OPCACHE_ENABLE=1
    volumes:
      - invoiceshelf_storage:/var/www/html/storage/
      - invoiceshelf_modules:/var/www/html/Modules/
    ports:
      - "8090:8080" # 8090 is the public port.
    networks:
      - invoiceshelf
    restart: unless-stopped
    depends_on:
      - database

networks:
  invoiceshelf:

volumes:
  invoiceshelf_mariadb:
  invoiceshelf_storage:
  invoiceshelf_modules: